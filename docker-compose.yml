version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: aip_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_intelligence_pipeline
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
